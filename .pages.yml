media:
  - name: images
    label: Images
    input: assets/images
    output: /assets/images
  - name: videos
    label: Videos
    input: assets/videos
    output: /assets/videos
    extensions: [mp4, webm, mov]

content:
  - name: blog
    label: Blog & Articles
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: description
        label: Short description
        type: text
      - name: image
        label: Cover image
        type: image
        options:
          media: images
      - name: body
        label: Article
        type: rich-text

  - name: videos
    label: Videos
    type: collection
    path: _videos
    filename: "{primary}.md"
    view:
      fields: [title, date]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: video_file
        label: Upload video file
        type: file
        options:
          media: videos
      - name: video_url
        label: Or YouTube/Vimeo link
        type: string
      - name: body
        label: Description
        type: rich-text